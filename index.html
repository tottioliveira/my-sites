<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head><body>
<title>Totti's Liveries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#E7EAE7; --surface:#F6F7F5; --raised:#FFFFFF; --ink:#141916; --muted:#5B655F; --faint:#8A938D;
  --line:#CFD5D0; --line-strong:#B4BCB6; --accent:#2B7A4B; --accent-ink:#FFFFFF; --accent-soft:#D8EADF;
  --stage:#1A1E1C; --stage-line:#2A302D; --hist:#3C4640;
  --zone:#C9D3E8; --zone-ink:#3C4E78;
  --warn:#A8620F; --bad:#B23A32; --good:#2B7A4B;
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D100F; --surface:#141816; --raised:#1B201D; --ink:#E3E8E4; --muted:#8F9A93; --faint:#66706A;
    --line:#252B28; --line-strong:#353D38; --accent:#5DBE84; --accent-ink:#0B1A11; --accent-soft:#1D3326;
    --stage:#090B0A; --stage-line:#1E2320; --hist:#9AA59E;
    --zone:#232C42; --zone-ink:#A9B8E0;
    --warn:#E0A04A; --bad:#EB6F66; --good:#5DBE84;
  }
}
:root[data-theme="dark"]{
  --ground:#0D100F; --surface:#141816; --raised:#1B201D; --ink:#E3E8E4; --muted:#8F9A93; --faint:#66706A;
  --line:#252B28; --line-strong:#353D38; --accent:#5DBE84; --accent-ink:#0B1A11; --accent-soft:#1D3326;
  --stage:#090B0A; --stage-line:#1E2320; --hist:#9AA59E;
  --zone:#232C42; --zone-ink:#A9B8E0;
  --warn:#E0A04A; --bad:#EB6F66; --good:#5DBE84;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--f-display);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:12px 24px;flex-wrap:wrap;padding:0 24px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding-block:14px}
.brand h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:.02em;white-space:nowrap}
.brand h1 b{color:var(--accent);font-weight:600}
.tabs{display:flex;gap:4px;align-self:stretch}
.tab{border:0;background:none;padding:0 14px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);box-shadow:inset 0 -2px 0 transparent;min-height:48px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.topbar .spacer{flex:1}
.pipeline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--faint);font-family:var(--f-mono);font-size:11.5px;padding-block:10px}
.pipeline span{padding:2px 7px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
.pipeline i{font-style:normal}
@media (max-width:520px){.topbar{padding:0 16px}.brand{padding-block:10px 4px}.tab{min-height:40px;padding:0 10px}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:292px minmax(0,1fr);gap:16px;padding:16px 24px 32px;max-width:1500px;margin:0 auto}
@media (max-width:980px){.shell{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.shell{padding:12px 16px 28px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-head{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}

/* ---------- queue ---------- */
.queue{display:flex;flex-direction:column;min-height:0;align-self:start}
.drop{margin:14px;border:1.5px dashed var(--line-strong);border-radius:var(--r);padding:22px 14px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;display:grid;gap:6px;justify-items:center}
.drop:hover,body.dragging .shell:not([hidden]) .drop{border-color:var(--accent);background:var(--accent-soft)}
.drop svg{color:var(--accent)}
.drop strong{font-weight:600}
.drop small{color:var(--muted);font-size:12px}
.files{list-style:none;margin:0;padding:0 8px 10px;display:grid;gap:2px;max-height:52vh;overflow:auto}
.file{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px;border-radius:5px;cursor:pointer;border:1px solid transparent}
.file:hover{background:var(--raised)}
.file.active{background:var(--raised);border-color:var(--line-strong)}
.file .thumb{width:36px;height:36px;border-radius:3px;background:var(--stage);display:block}
.file .meta{min-width:0}
.file .name{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .sub{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .sub .err{color:var(--bad)}
.file .bar{height:2px;background:var(--line);border-radius:2px;margin-top:5px;overflow:hidden}
.file .bar i{display:block;height:100%;background:var(--accent);width:0}
.file .side{display:flex;align-items:center;gap:4px}
.chip{font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;padding:1px 6px;border-radius:3px;border:1px solid var(--line-strong);color:var(--muted);text-transform:uppercase}
.chip.ex{border-color:var(--warn);color:var(--warn)}
.icon-btn{width:26px;height:26px;display:grid;place-items:center;border:0;background:transparent;border-radius:4px;color:var(--faint);cursor:pointer}
.icon-btn:hover{background:var(--line);color:var(--ink)}
.check{appearance:none;width:16px;height:16px;border:1.5px solid var(--line-strong);border-radius:3px;margin:0;display:grid;place-items:center;cursor:pointer;background:var(--raised);flex:none}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked::after{content:"";width:8px;height:4px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:translateY(-1px) rotate(-45deg)}
.check:disabled{opacity:.4}
.queue-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.linkish{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-size:12px;font-weight:500}
.empty-list{padding:4px 16px 16px;color:var(--faint);font-size:12.5px}

/* ---------- work area ---------- */
.work{display:grid;gap:16px;min-width:0;align-content:start}
.panes{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--stage-line);border-radius:0 0 var(--r) var(--r);overflow:hidden}
@media (max-width:640px){.panes{grid-template-columns:1fr}}
.pane{position:relative;background:var(--stage);aspect-ratio:1/1;max-height:62vh;width:100%;display:grid;place-items:center;overflow:hidden}
.pane canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.pane canvas.panning{cursor:grabbing}
.zoombar{display:flex;align-items:center;gap:2px;border:1px solid var(--line-strong);border-radius:5px;background:var(--raised);padding:2px}
.zoombar button{border:0;background:none;min-width:28px;height:26px;padding:0 8px;border-radius:3px;cursor:pointer;font-size:12px;font-weight:500;color:var(--muted)}
.zoombar button:hover{background:var(--line);color:var(--ink)}
.zoombar output{font-family:var(--f-mono);font-size:11.5px;min-width:52px;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums}
.viewer-foot{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}
.pane .tag{position:absolute;left:10px;top:10px;font-family:var(--f-display);font-weight:600;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#D9E0DB;background:rgba(9,11,10,.72);padding:3px 8px;border-radius:3px;pointer-events:none}
.pane .tag em{font-style:normal;color:#7FD3A0}
.pane .placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#6E7872;font-size:13px;text-align:center;padding:16px}
.readout{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.readout b{color:var(--ink);font-weight:500}
.fileinfo{display:flex;gap:10px;align-items:baseline;min-width:0;flex-wrap:wrap}
.fileinfo .nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.fileinfo .fmt{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.note{font-size:12px;color:var(--warn)}
.controls{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
@media (max-width:1180px){.controls{grid-template-columns:minmax(0,1fr)}}
.body{padding:14px}

/* ---------- shared controls ---------- */
.presets{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line-strong);background:var(--raised);padding:6px 12px;border-radius:5px;cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn .mono{font-size:11.5px;color:var(--muted)}
.btn.on{border-color:var(--accent);background:var(--accent-soft)}
.btn.on .mono{color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);padding:9px 16px;font-size:14px;justify-content:center}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:grid;gap:4px}
.field span{font-size:11px;color:var(--muted)}
.field input{width:100%;padding:6px 8px;border:1px solid var(--line-strong);border-radius:4px;background:var(--raised);font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}
.field input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.stack{display:grid;gap:18px}
.sub-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;user-select:none}
.switch input{appearance:none;width:30px;height:17px;border-radius:9px;background:var(--line-strong);position:relative;cursor:pointer;margin:0;transition:background .15s;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--raised);transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(13px)}

/* ---------- levels ---------- */
.hist-wrap{position:relative;padding:0 9px}
.hist{display:block;width:100%;height:132px;background:var(--raised);border:1px solid var(--line);border-radius:4px 4px 0 0}
.track.grad{height:10px;border:1px solid var(--line);border-top:0;background:linear-gradient(90deg,#000,#fff)}
.track.out-grad{height:10px;border:1px solid var(--line);border-radius:3px;background:linear-gradient(90deg,#000,#fff)}
.handles{position:relative;height:16px}
.h{position:absolute;top:0;width:18px;height:16px;margin-left:-9px;border:0;padding:0;background:none;cursor:ew-resize;touch-action:none}
.h::before{content:"";position:absolute;inset:0;clip-path:polygon(50% 0,100% 100%,0 100%);background:var(--ink)}
.h::after{content:"";position:absolute;inset:3px 4px 1.5px;clip-path:polygon(50% 0,100% 100%,0 100%);background:var(--hc)}
.h.black{--hc:#000}.h.gray{--hc:#8a8a8a}.h.white{--hc:#fff}
.h:focus-visible{outline:none}
.h:focus-visible::before{background:var(--accent)}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.nums.two{grid-template-columns:repeat(2,minmax(0,1fr))}

/* ---------- normal strength ---------- */
.fill-row{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--raised);border:1px solid var(--line);border-radius:5px}
.swatch{width:34px;height:34px;border-radius:4px;background:rgb(128,128,255);flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.fill-row div{display:grid;gap:1px;min-width:0}
.fill-row b{font-weight:600;font-size:13px}
.fill-row small{color:var(--muted);font-size:12px}
.op-scale{position:relative;padding:0 9px}
.zones{position:relative;height:22px}
.zone{position:absolute;top:0;bottom:0;background:var(--zone);color:var(--zone-ink);font-size:10.5px;font-weight:600;display:flex;align-items:center;justify-content:center;border-radius:3px;white-space:nowrap;overflow:hidden;padding:0 4px}
.op-range{width:100%;margin:8px 0 0;appearance:none;height:18px;background:transparent;cursor:pointer}
.op-range::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--line-strong),rgb(128,128,255))}
.op-range::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--line-strong),rgb(128,128,255))}
.op-range::-webkit-slider-thumb{appearance:none;width:18px;height:18px;border-radius:50%;background:var(--raised);border:2px solid var(--ink);margin-top:-6px}
.op-range::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--raised);border:2px solid var(--ink)}
.ticks{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--faint);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:var(--raised);display:grid;gap:2px}
.stat span{font-size:11px;color:var(--muted)}
.stat b{font-family:var(--f-mono);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.stat b i{font-style:normal;color:var(--faint)}
.op-row{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:12px;align-items:end}

/* ---------- export ---------- */
.export .body{display:grid;gap:16px;align-content:start}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line-strong);border-radius:5px;overflow:hidden}
.seg button{border:0;background:var(--raised);padding:7px 8px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.opt{display:grid;gap:6px}
.preview-name{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.dest{font-size:12px;color:var(--muted)}
.dest b{color:var(--ink);font-weight:500}
.log{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);min-height:1.5em;overflow-wrap:anywhere}
.log.ok{color:var(--good)}.log.bad{color:var(--bad)}
.progress{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="topbar">
  <div class="brand"><h1>Totti's <b>Liveries</b></h1></div>
  <nav class="tabs" role="tablist" aria-label="Tools">
    <button class="tab" role="tab" id="tab-rough" data-tab="rough" aria-selected="true" type="button">Roughmap</button>
    <button class="tab" role="tab" id="tab-normal" data-tab="normal" aria-selected="false" type="button">Normal map</button>
  </nav>
  <div class="spacer"></div>
  <div class="pipeline" id="pipeline" aria-label="Processing steps"></div>
</header>

<main class="shell" data-tool="rough" role="tabpanel" aria-labelledby="tab-rough"></main>
<main class="shell" data-tool="normal" role="tabpanel" aria-labelledby="tab-normal" hidden></main>

<script>
(() => {
"use strict";
/* ============================================================

   ============================================================ */
const P2="a01100110011001ba00100010001000ba11101110111011ba00100110011011ba00000010001001ba01101110111111ba00100110111111ba00000010011011ba00000000001001ba01101111111111ba00000010111111ba00000000001011ba00101111111111ba00000001111111ba00011111111111ba00000000000111ba00010001110111ba1b1000100000000a0000000b0001110a1b1001100010000a0b1000100000000a0001000b1001110a0000000b0001100a11100110011000ba0b1000100010000a0001000b0001100a1b0011001100110a0b1011001101100a0010111b1101000a0001111b1110000a1b1000110001110a0b1100110011100a10101010101010ba00011110000111ba10110b001011010a0110011b1001100a0b1110000111100a1010101b0101010a11010010110100ba10110101010010ba1b1001111001110a0010011b1001000a0b1001001001100a0b1101111011100a1b0100110010110a01111001100001ba11001101001100ba00001b001100000a10011b001000000a0b0011100100000a00000b001110010a0000100b1100100a11011001001001ba01101101100100ba1b0001110011100a0b1100111000110a11011001100100ba11000110011100ba11111101000000ba00110001110011ba00011110011001ba0b1001111110000a0b0001011101110a10001000111011b";
const P3="a01b00110221222ca00b0011c2112221a0002001c211221ba22c00220011011ba0000000b122112ca01b00110022002ca02c00221111111ba0110011c211221ba0000000b111222ca0001111b111222ca00011b12222222ca01200b20012001ca11201b20112011ca1220b220122012ca01b01121122122ca01b2001c2002220a00b00110112112ca11b0011c0012200a0001122b122112ca02c00220022111ba11b01110222022ca00b0001c2212221a00000b10122012ca0001100c2b02210a12c0b2200110000a0120012b122222ca11012c1b2210110a00001b012c11221a0221102b102002ca1100b102002222ca011012201c2001ba0002000c211222ba0000002b122122ca22c00220012001ba01b00120022022ca1200b2001c00120a00011b122c20000a1201201c0b20120a1202012bc010120a011220011c2001ba01111c22200001ba10b01012222222ca0000000c121212ba0221b220022112ca02c00110022001ba22012c10220122ba10122c22222010ba0002121c121212ba10b01010101222ca22c01110222011ba0021b120002111ca0002b122112211ca2220b110111022ca0021112b112000ca1100b100110222ca000000021b2211ca1100b102222222ca022001100b1002ca0221122b122002ca000000000002b1ca00c00010002000ba22212220222b22ca10b22222222222ca11b2011c2012220";
const PT2 = new Uint8Array(1024), PT3 = new Uint8Array(1024);
for (let i = 0; i < 1024; i++) for (const [s, t] of [[P2, PT2], [P3, PT3]]) { const k = "abc".indexOf(s[i]); t[i] = k >= 0 ? (k | 0x80) : (+s[i]); }
const W2 = [0,21,43,64], W3 = [0,9,18,27,37,46,55,64], W4 = [0,4,9,13,17,21,26,30,34,38,43,47,51,55,60,64];
const CB7 = [4,6,5,7,5,7,7,5], AB7 = [0,0,0,0,6,8,7,5];
const EP = new Int32Array(24), IDX = new Uint8Array(16);
let bp = 0;
function rb(b, o, n) { let v = 0; for (let i = 0; i < n; i++, bp++) v |= ((b[o + (bp >> 3)] >> (bp & 7)) & 1) << i; return v; }
const ip = (e0, e1, w, i) => ((64 - w[i]) * e0 + w[i] * e1 + 32) >> 6;

function bc7(b, o, B) {
  bp = 0;
  let mode = 0; while (mode < 8 && rb(b, o, 1) === 0) mode++;
  if (mode >= 8) { B.fill(0); return; }
  let np = 1, part = 0, rot = 0, isb = 0;
  if (mode === 0 || mode === 1 || mode === 2 || mode === 3 || mode === 7) { np = (mode === 0 || mode === 2) ? 3 : 2; part = rb(b, o, mode === 0 ? 4 : 6); }
  const ne = np * 2;
  if (mode === 4 || mode === 5) { rot = rb(b, o, 2); if (mode === 4) isb = rb(b, o, 1); }
  for (let c = 0; c < 3; c++) for (let j = 0; j < ne; j++) EP[j * 4 + c] = rb(b, o, CB7[mode]);
  if (AB7[mode]) for (let j = 0; j < ne; j++) EP[j * 4 + 3] = rb(b, o, AB7[mode]);
  const hasP = (0b11001011 >> mode) & 1;
  if (hasP) {
    for (let i = 0; i < ne * 4; i++) EP[i] <<= 1;
    if (mode === 1) {
      const p0 = rb(b, o, 1), p1 = rb(b, o, 1);
      for (let k = 0; k < 3; k++) { EP[k] |= p0; EP[4 + k] |= p0; EP[8 + k] |= p1; EP[12 + k] |= p1; }

    if (T.out === "green") return encodePNG(w, f.h, 2, (y, row) => { for (let x = 0, o = y * w; x < w; x++) { row[x * 3] = 0; row[x * 3 + 1] = lut[g[o + x]]; row[x * 3 + 2] = 0; } });
    return encodePNG(w, f.h, 0, (y, row) => { for (let x = 0, o = y * w; x < w; x++) row[x] = lut[g[o + x]]; });
  },
  exportExtraHTML: () => `<div class="opt"><span class="label">PNG channels</span>
      <div class="seg" role="group" aria-label="Output channels"><button type="button" data-q="outGray" aria-pressed="true">Grayscale</button><button type="button" data-q="outGreen" aria-pressed="false">Green only</button></div></div>`,
  controlsHTML: k => `
  <div class="panel">
    <div class="panel-head"><span class="label">Levels</span>
      <div class="presets">
        <button class="btn" data-q="presetDcs" type="button">DCS default <span class="mono">91 · 1.10 · 238</span></button>
        <button class="btn" data-q="presetReset" type="button">Reset</button>
      </div>
    </div>
    <div class="body stack">
      <div>
        <div class="sub-h"><span class="label">Input levels</span><label class="switch"><input type="checkbox" id="${k}-linked" checked> Same levels for all files</label></div>
        <div class="hist-wrap">
          <canvas class="hist" data-q="hist" height="132"></canvas>
          <div class="track grad"></div>
          <div class="handles" data-q="inHandles">
            <button class="h black" data-k="b" type="button" aria-label="Input black point"></button>
            <button class="h gray" data-k="g" type="button" aria-label="Midtone gamma"></button>
            <button class="h white" data-k="w" type="button" aria-label="Input white point"></button>
          </div>
        </div>
        <div class="nums">
          <label class="field"><span>Shadows</span><input id="${k}-inB" data-k="b" type="number" min="0" max="253" step="1" inputmode="numeric"></label>
          <label class="field"><span>Midtones (gamma)</span><input id="${k}-inG" data-k="g" type="number" min="0.1" max="9.99" step="0.01" inputmode="decimal"></label>
          <label class="field"><span>Highlights</span><input id="${k}-inW" data-k="w" type="number" min="2" max="255" step="1" inputmode="numeric"></label>
        </div>
      </div>
      <div>
        <div class="sub-h"><span class="label">Output levels</span></div>
        <div class="hist-wrap">
          <div class="track out-grad"></div>
          <div class="handles" data-q="outHandles">
            <button class="h black" data-k="ob" type="button" aria-label="Output black"></button>
            <button class="h white" data-k="ow" type="button" aria-label="Output white"></button>
          </div>
        </div>
        <div class="nums two">
          <label class="field"><span>Output black</span><input id="${k}-outB" data-k="ob" type="number" min="0" max="255" step="1" inputmode="numeric"></label>
          <label class="field"><span>Output white</span><input id="${k}-outW" data-k="ow" type="number" min="0" max="255" step="1" inputmode="numeric"></label>
        </div>
      </div>
    </div>
  </div>`,
  initControls(T) {
    const q = T.q, root = T.root;
    T.out = "gray";
    T.seg(q("outGray"), q("outGreen"), i => { T.out = i ? "green" : "gray"; T.renderOut(); });
    const inputs = [...root.querySelectorAll("input[data-k]")];
    const setL = patch => {
      const L = T.params(T.cur); Object.assign(L, patch);
      L.b = Math.round(Math.min(Math.max(L.b, 0), 253)); L.w = Math.round(Math.min(Math.max(L.w, L.b + 2), 255));
      if (L.b > L.w - 2) L.b = L.w - 2;
      L.g = Math.min(Math.max(Math.round(L.g * 100) / 100, 0.1), 9.99);
      L.ob = Math.round(Math.min(Math.max(L.ob, 0), 255)); L.ow = Math.round(Math.min(Math.max(L.ow, 0), 255));
      T.refresh();
    };
    inputs.forEach(el => {
      el.addEventListener("input", () => { const v = parseFloat(el.value); if (Number.isFinite(v)) setL({ [el.dataset.k]: v }); });
      el.addEventListener("change", () => { el.value = ""; T.refresh(); requestAnimationFrame(() => { const L = T.params(T.cur), k = el.dataset.k; el.value = k === "g" ? L.g.toFixed(2) : L[k]; }); });
    });
    ["inHandles", "outHandles"].forEach(n => {
      const wrap = q(n);
      wrap.querySelectorAll(".h").forEach(h => {
        const k = h.dataset.k;
        const apply = cx => {
          const r = wrap.getBoundingClientRect(), v = Math.min(255, Math.max(0, (cx - r.left) / r.width * 255));
          if (k === "g") { const L = T.params(T.cur), t = Math.min(.99, Math.max(.01, (v - L.b) / (L.w - L.b))); setL({ g: Math.log(t) / Math.log(0.5) }); }
          else setL({ [k]: v });
        };
        h.addEventListener("pointerdown", e => { e.preventDefault(); h.setPointerCapture(e.pointerId); h.focus(); });
        h.addEventListener("pointermove", e => { if (h.hasPointerCapture(e.pointerId)) apply(e.clientX); });
        h.addEventListener("keydown", e => {
          const L = T.params(T.cur), dir = (e.key === "ArrowRight" || e.key === "ArrowUp") ? 1 : (e.key === "ArrowLeft" || e.key === "ArrowDown") ? -1 : 0;
          if (!dir) return; e.preventDefault();
          if (k === "g") setL({ g: L.g - dir * (e.shiftKey ? .1 : .01) }); else setL({ [k]: L[k] + dir * (e.shiftKey ? 10 : 1) });
        });
      });
    });
    q("presetDcs").addEventListener("click", () => setL({ ...PRESET }));
    q("presetReset").addEventListener("click", () => setL({ ...IDENT }));
    root.querySelector("#rough-linked").addEventListener("change", e => {
      if (!e.target.checked) T.files.forEach(f => f.params = { ...T.shared }); else if (T.cur) T.shared = { ...T.cur.params };
      T.linked = e.target.checked; T.refresh();
    });
    function drawHist() {
      const c = q("hist"), dpr = window.devicePixelRatio || 1, W = c.clientWidth || 300, H = 132;
      c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
      const x = c.getContext("2d"); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, W, H);
      x.strokeStyle = cssVar("--line"); x.lineWidth = 1;
      for (const s of [.25, .5, .75]) { x.beginPath(); x.moveTo(Math.round(W * s) + .5, 0); x.lineTo(Math.round(W * s) + .5, H); x.stroke(); }
      const f = T.cur; if (!f || f.status !== "ready") return;
      const hist = f.hist, cap = Math.max(1, [...hist].sort((a, b) => a - b)[Math.floor(255 * .995)]), L = T.params(f), bw = W / 256;
      x.fillStyle = cssVar("--accent-soft"); x.fillRect(0, 0, L.b * bw, H); x.fillRect((L.w + 1) * bw, 0, W - (L.w + 1) * bw, H);
      x.fillStyle = cssVar("--hist");
      for (let i = 0; i < 256; i++) { const hg = Math.min(1, hist[i] / cap) * (H - 6); x.fillRect(i * bw, H - hg, Math.max(1, bw - .25), hg); }
    }
    return {
      sync() {
        const L = T.params(T.cur);
        inputs.forEach(el => { if (document.activeElement !== el) el.value = el.dataset.k === "g" ? L.g.toFixed(2) : L[el.dataset.k]; });
        const pos = { b: L.b, g: L.b + (L.w - L.b) * Math.pow(0.5, L.g), w: L.w, ob: L.ob, ow: L.ow };
        root.querySelectorAll(".h").forEach(h => { const k = h.dataset.k; h.style.left = (pos[k] / 255 * 100) + "%"; h.setAttribute("aria-valuetext", k === "g" ? L.g.toFixed(2) : String(L[k])); });
        q("presetDcs").classList.toggle("on", sameL(L, PRESET));
        drawHist();
      }
    };
  }
});

/* ============================================================
   Normal map tool — flat 128·128·255 layer at an opacity
   ============================================================ */
const FLAT = [128, 128, 255];
function blendLUTs(op) {
  const p = op / 100, L = [new Uint8Array(256), new Uint8Array(256), new Uint8Array(256)];
  for (let c = 0; c < 3; c++) for (let v = 0; v < 256; v++) L[c][v] = Math.round(v * (1 - p) + FLAT[c] * p);
  return L;
}
/* angle between a pixel's normal and straight up, in degrees */
const tilt = (r, g, b) => { const x = r / 127.5 - 1, y = g / 127.5 - 1, z = b / 127.5 - 1, l = Math.hypot(x, y, z) || 1; return Math.acos(Math.max(-1, Math.min(1, z / l))) * 180 / Math.PI; };
const NORMAL_PRESETS = [{ op: 15, label: "Slightly weaker" }, { op: 40, label: "Noticeably weaker" }, { op: 75, label: "Almost flat" }];

const normal = makeTool("normal", {
  noun: "Normal map", listLabel: "Normal maps", dropTitle: "Drop normal map .dds files", want: "rgba", suffix: "_weak", zipName: "normals",
  srcTag: "Original <em>· normal</em>", outTag: "Weakened <em>· result</em>", emptyText: "Drop a normal map .dds to begin",
  defaults: { op: 40 },
  example() {
    const n = 512, H = exampleField(n), D = new Uint8Array(n * n * 4), s = 3.2;
    const at = (x, y) => H[Math.min(n - 1, Math.max(0, y)) * n + Math.min(n - 1, Math.max(0, x))];
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      let nx = -(at(x + 1, y) - at(x - 1, y)) * s, ny = (at(x, y + 1) - at(x, y - 1)) * s, nz = 1;
      const l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l;
      const o = (y * n + x) * 4;
      D[o] = Math.round((nx * .5 + .5) * 255); D[o + 1] = Math.round((ny * .5 + .5) * 255); D[o + 2] = Math.round((nz * .5 + .5) * 255); D[o + 3] = 255;
    }
    return { name: "example_normal.dds", w: n, h: n, data: D, fmt: "BC7 · example", note: "" };
  },
  prepare(f) {
    let a = false; const d = f.data;
    for (let i = 3; i < d.length; i += 4) if (d[i] !== 255) { a = true; break; }
    f.hasAlpha = a;
    const pd = f.prev.pd; let sum = 0, n = 0;
    for (let i = 0; i < pd.length; i += 16) { sum += tilt(pd[i], pd[i + 1], pd[i + 2]); n++; }
    f.tiltBase = n ? sum / n : 0;
  },
  frame(T, f) {
    const [R, G, B] = blendLUTs(T.params(f).op);
    return {
      src: (d, i) => { const o = i * 4; return 0xff000000 | (d[o + 2] << 16) | (d[o + 1] << 8) | d[o]; },
      out: (d, i) => { const o = i * 4; return 0xff000000 | (B[d[o + 2]] << 16) | (G[d[o + 1]] << 8) | R[d[o]]; }
    };
  },
  readout(T, f, i) {
    const d = f.data, o = i * 4, [R, G, B] = blendLUTs(T.params(f).op), r = d[o], g = d[o + 1], b = d[o + 2];
    return `<span>RGB <b>${r}·${g}·${b}</b> → <b>${R[r]}·${G[g]}·${B[b]}</b></span><span>tilt <b>${tilt(r, g, b).toFixed(1)}°</b> → <b>${tilt(R[r], G[g], B[b]).toFixed(1)}°</b></span>`;
  },
  encode(T, f) {
    const [R, G, B] = blendLUTs(T.params(f).op), d = f.data, w = f.w, a = f.hasAlpha, ch = a ? 4 : 3;
    return encodePNG(w, f.h, a ? 6 : 2, (y, row) => {
      for (let x = 0, s = y * w * 4, o = 0; x < w; x++, s += 4, o += ch) { row[o] = R[d[s]]; row[o + 1] = G[d[s + 1]]; row[o + 2] = B[d[s + 2]]; if (a) row[o + 3] = d[s + 3]; }
    });
  },
  controlsHTML: k => `
  <div class="panel">
    <div class="panel-head"><span class="label">Flatten strength</span>
      <div class="presets">
        ${NORMAL_PRESETS.map(p => `<button class="btn" data-op="${p.op}" type="button">${p.label} <span class="mono">${p.op}%</span></button>`).join("")}
        <button class="btn" data-op="0" type="button">Original</button>
      </div>
    </div>
    <div class="body stack">
      <div class="fill-row"><span class="swatch" aria-hidden="true"></span>
        <div><b>Flat normal layer <span class="mono" style="font-weight:400;color:var(--muted)">R 128 · G 128 · B 255</span></b>
        <small>Blended over the map at the opacity below, the same as a solid fill layer in Photoshop, flattened on export.</small></div>
      </div>
      <div>
        <div class="sub-h"><span class="label">Layer opacity</span><label class="switch"><input type="checkbox" id="${k}-linked" checked> Same strength for all files</label></div>
        <div class="op-scale">
          <div class="zones" aria-hidden="true">
            <div class="zone" style="left:10%;width:10%" title="10–20% slightly weaker">slight</div>
            <div class="zone" style="left:30%;width:20%" title="30–50% noticeably weaker">noticeable</div>
            <div class="zone" style="left:70%;width:30%" title="70%+ very weak / almost flat">very weak</div>
          </div>
          <input class="op-range" type="range" id="${k}-op" min="0" max="100" step="1" aria-label="Flat layer opacity">
          <div class="ticks"><span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span></div>
        </div>
      </div>
      <div class="op-row">
        <div class="stats">
          <div class="stat"><span>Mean surface tilt</span><b data-q="tiltStat">–</b></div>
          <div class="stat"><span>Detail kept</span><b data-q="keptStat">–</b></div>
        </div>
        <label class="field"><span>Opacity %</span><input id="${k}-opNum" type="number" min="0" max="100" step="1" inputmode="numeric"></label>
      </div>
    </div>
  </div>`,
  initControls(T) {
    const root = T.root, q = T.q, range = root.querySelector("#normal-op"), num = root.querySelector("#normal-opNum");
    const setOp = v => { if (!Number.isFinite(v)) return; T.params(T.cur).op = Math.round(Math.min(100, Math.max(0, v))); T.refresh(); };
    range.addEventListener("input", () => setOp(+range.value));
    num.addEventListener("input", () => setOp(parseFloat(num.value)));
    num.addEventListener("change", () => { num.value = T.params(T.cur).op; });
    root.querySelectorAll("[data-op]").forEach(b => b.addEventListener("click", () => setOp(+b.dataset.op)));
    root.querySelector("#normal-linked").addEventListener("change", e => {
      if (!e.target.checked) T.files.forEach(f => f.params = { ...T.shared }); else if (T.cur) T.shared = { ...T.cur.params };
      T.linked = e.target.checked; T.refresh();
    });
    return {
      sync() {
        const op = T.params(T.cur).op, f = T.cur;
        range.value = op; if (document.activeElement !== num) num.value = op;
        root.querySelectorAll("[data-op]").forEach(b => b.classList.toggle("on", +b.dataset.op === op));
        if (f && f.status === "ready") {
          const [R, G, B] = blendLUTs(op), pd = f.prev.pd; let s = 0, n = 0;
          for (let i = 0; i < pd.length; i += 16) { s += tilt(R[pd[i]], G[pd[i + 1]], B[pd[i + 2]]); n++; }
          const after = n ? s / n : 0;
          q("tiltStat").innerHTML = `${f.tiltBase.toFixed(1)}° <i>→</i> ${after.toFixed(1)}°`;
          q("keptStat").textContent = f.tiltBase > 0.05 ? Math.round(after / f.tiltBase * 100) + "%" : "–";
        } else { q("tiltStat").textContent = "–"; q("keptStat").textContent = "–"; }
      }
    };
  }
});

/* ============================================================
   Tabs, drag & drop, boot
   ============================================================ */
const tools = { rough, normal };
const PIPES = {
  rough: [".dds", "decode", "G channel", "levels", ".png"],
  normal: [".dds", "decode", "RGB", "+ flat 128·128·255", ".png"]
};
let active = "rough";
function setTab(k) {
  active = k;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === k)));
  document.querySelectorAll("[data-tool]").forEach(m => m.hidden = m.dataset.tool !== k);
  document.getElementById("pipeline").innerHTML = PIPES[k].map(s => `<span>${s}</span>`).join("<i>→</i>");
  try { localStorage.setItem("tl-tab", k); } catch (e) {}
  tools[k].refresh();
}
document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => setTab(t.dataset.tab));
  t.addEventListener("keydown", e => { if (e.key === "ArrowRight" || e.key === "ArrowLeft") { const n = active === "rough" ? "normal" : "rough"; setTab(n); document.getElementById("tab-" + n).focus(); } });
});
let dragDepth = 0;
document.addEventListener("dragenter", e => { if ([...e.dataTransfer.types].includes("Files")) { dragDepth++; document.body.classList.add("dragging"); } });
document.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => { e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging"); if (e.dataTransfer.files.length) tools[active].addFiles(e.dataTransfer.files); });
const redraw = () => tools[active].refresh();
window.addEventListener("resize", redraw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redraw);
new MutationObserver(redraw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

rough.start(); normal.start();
let saved = "rough"; try { saved = localStorage.getItem("tl-tab") || "rough"; } catch (e) {}
setTab(tools[saved] ? saved : "rough");
})();
</script>
